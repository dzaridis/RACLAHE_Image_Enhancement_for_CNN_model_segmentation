version: '3.8'

services:
  raclahe:
    image: raclahe:3.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raclahe-processor

    # EUCAIM-style volume mounts (default configuration)
    volumes:
      - ./input:/home/ds/datasets:ro  # Read-only input (EUCAIM standard)
      - ./output:/home/ds/persistent-home
      - ./shared:/home/ds/persistent-shared-folder

    # Positional arguments appended to the ENTRYPOINT: INPUT_DIR OUTPUT_DIR
    command: ["/home/ds/datasets", "/home/ds/persistent-home/output"]

    # User configuration (matches EUCAIM requirements)
    user: "1000:1000"

    # Resource limits (optional, adjust as needed)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G
